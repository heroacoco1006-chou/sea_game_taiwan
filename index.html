<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>大航海福爾摩沙</title>
    <style>
      :root {
        /* iPhone 四邊安全區不對稱；每組取較大值，避免瀏海又維持實體螢幕置中。 */
        --safe-x: max(
          env(safe-area-inset-left, 0px),
          env(safe-area-inset-right, 0px)
        );
        --safe-y: max(
          env(safe-area-inset-top, 0px),
          env(safe-area-inset-bottom, 0px)
        );
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d1b2a;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        /* Phaser 已會置中 canvas；外框不可再用 flex 重複置中。 */
        position: fixed;
        inset: var(--safe-y) var(--safe-x);
        touch-action: none;
      }
      canvas { touch-action: none; }
      #rotate-tip {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(13, 27, 42, 0.94);
        color: #f5ecd2;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
        padding: 28px;
        text-align: center;
      }
      #rotate-tip.dismissed { display: none !important; }
      #rotate-tip .card {
        max-width: 340px;
        margin: 22vh auto 0;
        padding: 22px 20px;
        border-radius: 14px;
        background: #2b1e12;
        border: 2px solid #d4a64a;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      #rotate-tip h2 { margin: 0 0 10px; font-size: 20px; color: #ffe39a; }
      #rotate-tip p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #e8d9b0; }
      #rotate-tip button {
        border: 2px solid #d4a64a;
        background: #6b4423;
        color: #fff8e0;
        font-size: 15px;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-tip { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-tip" role="dialog" aria-label="建議橫向遊玩">
      <div class="card">
        <h2>📱 建議把手機轉成橫向</h2>
        <p>《大航海福爾摩沙》的畫面與字體為橫向設計，將手機橫放會更好看、按鈕也更好按喔！</p>
        <button type="button" onclick="document.getElementById('rotate-tip').classList.add('dismissed')">仍要直立遊玩</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
