<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>大航海福爾摩沙</title>
    <style>
      :root {
        /* iPhone 四邊安全區不對稱；每組取較大值，避免瀏海又維持實體螢幕置中。 */
        --safe-x: max(
          env(safe-area-inset-left, 0px),
          env(safe-area-inset-right, 0px)
        );
        --safe-y: max(
          env(safe-area-inset-top, 0px),
          env(safe-area-inset-bottom, 0px)
        );
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d1b2a;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        /* Phaser 已會置中 canvas；外框不可再用 flex 重複置中。 */
        position: fixed;
        inset: var(--safe-y) var(--safe-x);
        touch-action: none;
      }
      canvas { image-rendering: pixelated; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
